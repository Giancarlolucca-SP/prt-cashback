services:
  - type: web
    name: postocash-api
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Banco = mesmo Supabase do .env local (jjzbqkrxvrrkszwajhqb / us-east-2).
      # Os VALORES são definidos manualmente no dashboard do Render (Secret), copiados do .env:
      #   DATABASE_URL → pooler 6543 ...supabase.com:6543/postgres?pgbouncer=true   (runtime)
      #   DIRECT_URL   → direto 5432 ...supabase.com:5432/postgres                  (migrations)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ZAPI_INSTANCE_ID
        sync: false
      - key: ZAPI_TOKEN
        sync: false
      - key: STATION_NAME
        value: PostoCash
      - key: FRONTEND_URL
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        sync: false
      - key: WHATSAPP_PROVIDER
        value: evolution
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
